name: Check Things
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.6.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Semantic Thing diff
        if: github.event_name == 'pull_request'
        run: pnpm diff:things "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | tee thing-diff.md
      - name: Add diff to job summary
        if: github.event_name == 'pull_request'
        run: cat thing-diff.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with: { name: thing-semantic-diff, path: thing-diff.md }

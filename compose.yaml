name: wikitop
services:
  play-db:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wikitop
      POSTGRES_USER: wikitop
      POSTGRES_PASSWORD: ${PLAY_DB_PASSWORD:?Set PLAY_DB_PASSWORD}
    volumes: [play-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wikitop -d wikitop]
      interval: 5s
      timeout: 3s
      retries: 20
  wiki-db:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD:?Set WIKI_DB_PASSWORD}
    volumes: [wiki-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wiki -d wiki]
      interval: 5s
      timeout: 3s
      retries: 20
  auth-db:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
    volumes: [auth-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak -d keycloak]
      interval: 5s
      timeout: 3s
      retries: 20
  wiki:
    image: ghcr.io/requarks/wiki:2.5.315
    restart: unless-stopped
    depends_on:
      wiki-db: { condition: service_healthy }
    environment:
      DB_TYPE: postgres
      DB_HOST: wiki-db
      DB_PORT: 5432
      DB_USER: wiki
      DB_PASS: ${WIKI_DB_PASSWORD}
      DB_NAME: wiki
    volumes: [wiki-data:/wiki/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: [start, --import-realm]
    restart: unless-stopped
    depends_on:
      auth-db: { condition: service_healthy }
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOST:?Set AUTH_HOST}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      WIKITOP_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      WIKI_CLIENT_SECRET: ${WIKI_OIDC_CLIENT_SECRET:?Set WIKI_OIDC_CLIENT_SECRET}
      PLAY_ORIGIN: https://${PLAY_HOST:?Set PLAY_HOST}
      WIKI_ORIGIN: https://${WIKI_HOST:?Set WIKI_HOST}
    volumes: [./infra/realm.json:/opt/keycloak/data/import/wikitop.json:ro]
  storage:
    image: chrislusf/seaweedfs:3.85
    entrypoint: [/bin/sh, /etc/wikitop/start-storage.sh]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - assets:/data
      - ./infra/start-storage.sh:/etc/wikitop/start-storage.sh:ro
  play:
    build: .
    restart: unless-stopped
    depends_on:
      play-db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: https://${PLAY_HOST}
      DATABASE_URL: postgres://wikitop:${PLAY_DB_PASSWORD}@play-db:5432/wikitop
      WIKI_URL: https://${WIKI_HOST}
      WIKI_INTERNAL_URL: http://wiki:3000
      WIKI_API_KEY: ${WIKI_API_KEY:-unconfigured}
      WIKI_AUTH_PROVIDER_KEY: ${WIKI_AUTH_PROVIDER_KEY:-oidc}
      OIDC_ISSUER: https://${AUTH_HOST}/realms/wikitop
      OIDC_CLIENT_ID: wikitop
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: wikitop
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DEV_AUTH: "false"
      WIKI_MODE: remote
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports: [80:80, 443:443, 443:443/udp]
    environment:
      PLAY_HOST: ${PLAY_HOST}
      WIKI_HOST: ${WIKI_HOST}
      AUTH_HOST: ${AUTH_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      [
        ./infra/Caddyfile:/etc/caddy/Caddyfile:ro,
        caddy-data:/data,
        caddy-config:/config,
      ]
    networks:
      default:
        aliases: ["${AUTH_HOST}"]
volumes:
  play-db:
  wiki-db:
  auth-db:
  wiki-data:
  assets:
  caddy-data:
  caddy-config:
